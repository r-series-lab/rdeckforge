name: Bug report
description: Report a reproducible rDeckForge problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include customer documents, private templates, logos, internal paths, credentials, or unredacted AI output.
  - type: input
    id: version
    attributes:
      label: rDeckForge version
      placeholder: 0.1.5
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux CLI, Other]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options: [AI handoff, Template library, Content validation, Generation, Task center, CLI, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using repository examples
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed customer data, private template paths, internal URLs, credentials, and personal files.
          required: true
