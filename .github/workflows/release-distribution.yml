name: Release Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            renderers/pptx-node/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix web
      - run: npm ci --prefix renderers/pptx-node
      - run: npm run test:scripts
      - run: npm --prefix web test
      - run: cargo test --workspace
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: rDeckForge-macos-aarch64-distribution
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.sig

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      RDECKFORGE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            renderers/pptx-node/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Windows signing certificate
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "rdeckforge-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item $certificatePath -Force
      - run: npm ci --prefix web
      - run: npm ci --prefix renderers/pptx-node
      - run: npm run test:scripts
      - run: npm --prefix web test
      - run: cargo test --workspace
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: rDeckForge-windows-x64-distribution
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig

  publish-draft:
    name: Create draft prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          mv SHA256SUMS.txt release-assets/SHA256SUMS.txt
      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
          body: |
            rDeckForge preview distribution.

            Review platform signing, notarization, checksums, installation behavior, and updater metadata before making this release public.
